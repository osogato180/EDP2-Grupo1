version: "3.9"

services:
  db:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_DB: inventario
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: streamlit_app
    ports:
      - "8501:8501"
    environment:
      DB_HOST: db
      DB_NAME: inventario
      DB_USER: admin
      DB_PASSWORD: admin123
    depends_on:
      - db

volumes:
  postgres_data: