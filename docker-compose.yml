version: "3.9"

services:

  app:
    image: python:3.11-slim
    container_name: streamlit_app
    working_dir: /app
    ports:
      - "8501:8501"
    volumes:
      - ./app:/app
      - uploads:/app/uploads
    environment:
      DB_HOST: db
      DB_NAME: inventario
      DB_USER: admin
      DB_PASSWORD: admin
      REDIS_HOST: redis
      RABBIT_HOST: rabbitmq
    command: >
      bash -c "
      pip install -r requirements.txt &&
      streamlit run app.py --server.address=0.0.0.0
      "
    depends_on:
      - db
      - redis
      - rabbitmq

  db:
    image: postgres:14
    environment:
      POSTGRES_DB: inventario
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis_cache

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "15672:15672"

  mailhog:
    image: mailhog/mailhog
    ports:
      - "8025:8025"

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

volumes:
  postgres_data:
  uploads:
